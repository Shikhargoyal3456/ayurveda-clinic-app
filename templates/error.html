<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token | default('') }}">
    <title>{{ status_code }} - {{ error_title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background: #ff8233;
            overflow: hidden;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; }
        .error-page {
            position: relative;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(180deg, #ff8233 0%, #fdac55 100%);
        }
        .error-bg {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            opacity: 0.78;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 95%);
            mask-image: linear-gradient(to bottom, #000 40%, transparent 95%);
        }
        .error-code {
            color: #fff;
            font-size: clamp(180px, 43vw, 760px);
            font-weight: 900;
            line-height: 0.76;
            letter-spacing: 0;
            white-space: nowrap;
            transform: scaleX(1.08) scaleY(var(--code-scale, 1.25));
            transform-origin: center;
            user-select: none;
        }
        .error-oval {
            position: absolute;
            width: clamp(120px, 20vw, 360px);
            height: clamp(110px, 26vh, 420px);
            border-radius: 999px;
            background: #fff;
            transform: scaleY(var(--oval-scale, 1));
            transform-origin: center;
        }
        .error-nav {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: clamp(16px, 3vw, 28px) clamp(18px, 5vw, 48px);
        }
        .brand, .menu-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: clamp(18px, 2vw, 22px);
        }
        .brand-mark {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }
        .brand-mark span {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #fff;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #fff;
            color: #f16524;
            font-size: 14px;
            font-weight: 700;
        }
        .icon-button, .menu-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            cursor: pointer;
        }
        .menu-open {
            gap: 8px;
            min-height: 42px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #f16524;
            color: #fff;
            font-weight: 700;
        }
        .menu-icon {
            position: relative;
            width: 18px;
            height: 12px;
        }
        .menu-icon::before, .menu-icon::after, .menu-icon span {
            position: absolute;
            left: 0;
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }
        .menu-icon::before { top: 0; }
        .menu-icon span { top: 5px; }
        .menu-icon::after { bottom: 0; }
        .center-media {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: calc(-6vh - 40px);
            pointer-events: none;
        }
        .center-media video {
            width: min(120vw, 900px);
            height: min(82vh, 760px);
            object-fit: contain;
            mix-blend-mode: darken;
        }
        .error-content {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: auto;
            padding: 0 18px clamp(34px, 8vh, 70px);
            text-align: center;
        }
        .error-content h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(20px, 3vw, 32px);
            font-weight: 800;
            letter-spacing: 0;
        }
        .error-content p {
            max-width: 660px;
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 600;
            line-height: 1.45;
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            margin-top: 6px;
            padding: 14px 24px;
            border-radius: 999px;
            background: #f16524;
            color: #fff;
            font-weight: 800;
            box-shadow: 0 14px 36px rgba(143, 55, 9, 0.24);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        .home-link:hover { transform: translateY(-2px); box-shadow: 0 18px 44px rgba(143, 55, 9, 0.3); }
        .arrow-left {
            width: 18px;
            height: 18px;
            border-left: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg);
        }
        .error-id {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            font-size: 13px;
        }
        .drawer {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }
        .drawer.is-open { pointer-events: auto; }
        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 320ms ease;
        }
        .drawer.is-open .drawer-backdrop { opacity: 1; }
        .drawer-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: min(100%, 390px);
            height: 100%;
            padding: 24px;
            background: linear-gradient(135deg, #ff6b1a 0%, #ff9642 100%);
            transform: translateX(100%);
            transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .drawer.is-open .drawer-panel { transform: translateX(0); }
        .drawer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        .drawer-close {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }
        .drawer-close::before, .drawer-close::after {
            position: absolute;
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }
        .drawer-close::before { transform: rotate(45deg); }
        .drawer-close::after { transform: rotate(-45deg); }
        .drawer-links {
            display: grid;
            gap: 10px;
            margin-top: 28px;
        }
        .drawer-links a {
            padding: 16px 18px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.13);
            font-size: 18px;
            font-weight: 800;
        }
        .drawer-cta {
            position: absolute;
            right: 24px;
            bottom: 24px;
            left: 24px;
            display: flex;
            justify-content: center;
            padding: 15px 18px;
            border-radius: 999px;
            background: #fff;
            color: #f16524;
            font-weight: 800;
        }
        @media (max-width: 820px) {
            .nav-links { display: none; }
            .menu-open span:last-child { display: none; }
            .center-media video { width: 122vw; height: 76vh; }
            .error-code { font-size: clamp(170px, 58vw, 420px); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
            .center-media video { display: none; }
        }
    </style>
</head>
<body>
    <div class="error-page" data-error-page>
        <div class="error-bg" aria-hidden="true">
            <div class="error-code" data-error-code>{{ status_code }}</div>
            <div class="error-oval"></div>
        </div>

        <nav class="error-nav" aria-label="Error page navigation">
            <a class="brand" href="/" aria-label="Kash AI home">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                <span>Kash AI</span>
            </a>
            <div class="nav-links">
                <a href="/telemedicine/book">Consult</a>
                <a href="/order-medicines">Medicines</a>
                <a href="/diagnostics/lab-booking">Labs</a>
                <a href="/contact">Contact</a>
            </div>
            <button class="menu-open" type="button" data-menu-open aria-label="Open menu">
                <span class="menu-icon" aria-hidden="true"><span></span></span>
                <span>Menu</span>
            </button>
        </nav>

        <div class="center-media" aria-hidden="true">
            <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4"></video>
        </div>

        <main class="error-content">
            <h1>{{ error_title }}</h1>
            <p>{{ error_message }}</p>
            {% if error_id %}
            <span class="error-id">Error ID: {{ error_id }}</span>
            {% endif %}
            <a class="home-link" href="/">
                <span class="arrow-left" aria-hidden="true"></span>
                Back to Home
            </a>
        </main>

        <div class="drawer" data-drawer>
            <div class="drawer-backdrop" data-menu-close></div>
            <aside class="drawer-panel" aria-label="Menu">
                <div class="drawer-head">
                    <a class="menu-brand" href="/">
                        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                        <span>Kash AI</span>
                    </a>
                    <button class="icon-button drawer-close" type="button" data-menu-close aria-label="Close menu"></button>
                </div>
                <div class="drawer-links">
                    <a href="/">Home</a>
                    <a href="/telemedicine/book">Consult</a>
                    <a href="/order-medicines">Medicines</a>
                    <a href="/diagnostics/lab-booking">Labs</a>
                    <a href="/contact">Contact</a>
                </div>
                <a class="drawer-cta" href="/">Back to Home</a>
            </aside>
        </div>
    </div>

    <script>
        (function () {
            const page = document.querySelector("[data-error-page]");
            const code = document.querySelector("[data-error-code]");
            const drawer = document.querySelector("[data-drawer]");
            const openButton = document.querySelector("[data-menu-open]");
            const closeButtons = document.querySelectorAll("[data-menu-close]");

            function updateScale() {
                if (!page || !code) return;
                const height = code.getBoundingClientRect().height || 1;
                const scale = Math.max(0.72, Math.min(1.55, (window.innerHeight / height) * 0.92));
                page.style.setProperty("--code-scale", String(scale * 1.15));
                page.style.setProperty("--oval-scale", String(scale));
            }

            function setMenu(open) {
                if (!drawer) return;
                drawer.classList.toggle("is-open", open);
                document.body.style.overflow = open ? "hidden" : "";
                openButton?.setAttribute("aria-expanded", String(open));
            }

            updateScale();
            window.addEventListener("resize", updateScale);
            openButton?.addEventListener("click", () => setMenu(true));
            closeButtons.forEach((button) => button.addEventListener("click", () => setMenu(false)));
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape") setMenu(false);
            });
        })();
    </script>
</body>
</html>
