<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token | default('') }}">
    <meta name="theme-color" content="#0B1512">
    <title>{{ status_code }} — {{ error_title }} · Kash AI</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink:#0B1512; --ink-2:#081109; --bone:#F4EEE1;
            --muted:rgba(244,238,225,0.66); --turmeric:#E8B24A; --gold-deep:#C6871B;
            --verdant:#2FC98A; --clay:#B4633A; --sage:#8AA894;
            --border:rgba(138,168,148,0.16);
            --f-display:'Fraunces',Georgia,serif;
            --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
            --f-util:'Space Grotesk','Inter',system-ui,sans-serif;
        }
        *{box-sizing:border-box;}
        html,body{margin:0;min-height:100%;}
        body{
            font-family:var(--f-body);color:var(--bone);
            background:
              radial-gradient(58% 48% at 82% 8%, rgba(232,178,74,0.16), transparent 60%),
              radial-gradient(52% 46% at 8% 96%, rgba(47,201,138,0.12), transparent 60%),
              linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
            -webkit-font-smoothing:antialiased;
        }
        a{color:inherit;text-decoration:none;}
        button{font:inherit;}
        .error-page{position:relative;display:flex;min-height:100vh;min-height:100dvh;flex-direction:column;overflow:hidden;}

        /* watermark status code */
        .error-bg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
            -webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 92%);
            mask-image:linear-gradient(to bottom,#000 45%,transparent 92%);}
        .error-code{font-family:var(--f-display);font-weight:600;
            font-size:clamp(170px,40vw,640px);line-height:0.8;white-space:nowrap;user-select:none;
            color:transparent;background:linear-gradient(180deg,rgba(244,238,225,0.10),rgba(244,238,225,0.02));
            -webkit-background-clip:text;background-clip:text;
            transform:scaleY(var(--code-scale,1.15));transform-origin:center;}

        /* NAV */
        .error-nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
            padding:clamp(16px,3vw,26px) clamp(18px,5vw,48px);}
        .brand,.menu-brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2vw,22px);}
        .brand-mark{width:30px;height:30px;flex:none;}
        .nav-links{display:flex;align-items:center;gap:6px;}
        .nav-links a{display:inline-flex;align-items:center;min-height:36px;padding:8px 16px;border-radius:999px;
            font-family:var(--f-util);font-size:14px;font-weight:500;color:var(--muted);transition:.18s;}
        .nav-links a:hover{color:var(--bone);background:rgba(244,238,225,0.06);}
        .icon-button,.menu-open{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;}
        .menu-open{gap:8px;min-height:42px;padding:10px 18px;border-radius:999px;
            background:rgba(244,238,225,0.06);border:1px solid var(--border);color:var(--bone);font-family:var(--f-util);font-weight:600;}
        .menu-icon{position:relative;width:18px;height:12px;}
        .menu-icon::before,.menu-icon::after,.menu-icon span{position:absolute;left:0;width:18px;height:2px;border-radius:999px;background:currentColor;content:"";}
        .menu-icon::before{top:0;}.menu-icon span{top:5px;}.menu-icon::after{bottom:0;}

        /* ORB */
        .center-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin-top:calc(-6vh - 20px);pointer-events:none;}
        .orb{position:relative;width:min(360px,64vw);aspect-ratio:1;border-radius:50%;
            background:
              radial-gradient(circle at 34% 30%, rgba(232,178,74,0.9), rgba(232,178,74,0) 46%),
              radial-gradient(circle at 70% 74%, rgba(47,201,138,0.8), rgba(47,201,138,0) 52%),
              radial-gradient(circle at 60% 40%, rgba(180,99,58,0.5), rgba(180,99,58,0) 40%),
              radial-gradient(circle at 50% 50%, rgba(22,51,38,0.5), var(--ink) 80%);
            box-shadow:inset 0 0 90px rgba(0,0,0,0.55), 0 30px 90px rgba(0,0,0,0.5);
            opacity:0.72;animation:breathe 7s ease-in-out infinite;}
        .orb::before{content:"";position:absolute;inset:-12%;border-radius:50%;
            background:conic-gradient(from 0deg, rgba(232,178,74,0), rgba(232,178,74,0.5), rgba(47,201,138,0.45), rgba(180,99,58,0.25), rgba(232,178,74,0));
            filter:blur(16px);opacity:0.5;animation:spin 22s linear infinite;}

        /* CONTENT */
        .error-content{position:relative;z-index:30;display:flex;flex-direction:column;align-items:center;gap:14px;
            margin-top:auto;padding:0 18px clamp(34px,8vh,72px);text-align:center;}
        .error-content h1{max-width:760px;margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3.4vw,40px);letter-spacing:-0.01em;}
        .error-content p{max-width:620px;margin:0;color:var(--muted);font-size:clamp(15px,2vw,18px);line-height:1.55;}
        .home-link{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;margin-top:8px;
            padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,var(--turmeric),var(--gold-deep));
            color:#17201C;font-family:var(--f-util);font-weight:600;box-shadow:0 14px 36px rgba(232,178,74,0.28);
            transition:transform 180ms ease,box-shadow 180ms ease;}
        .home-link:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(232,178,74,0.4);}
        .arrow-left{width:16px;height:16px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);}
        .error-id{padding:6px 12px;border-radius:999px;background:rgba(244,238,225,0.08);border:1px solid var(--border);
            font-family:var(--f-util);font-size:13px;color:var(--muted);}

        /* DRAWER */
        .drawer{position:fixed;inset:0;z-index:50;pointer-events:none;}
        .drawer.is-open{pointer-events:auto;}
        .drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);opacity:0;transition:opacity 320ms ease;}
        .drawer.is-open .drawer-backdrop{opacity:1;}
        .drawer-panel{position:absolute;top:0;right:0;width:min(100%,380px);height:100%;padding:24px;
            background:linear-gradient(160deg,#132a22 0%, #0B1512 100%);border-left:1px solid var(--border);
            transform:translateX(100%);transition:transform 420ms cubic-bezier(0.16,1,0.3,1);}
        .drawer.is-open .drawer-panel{transform:translateX(0);}
        .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:18px;}
        .drawer-close{position:relative;width:42px;height:42px;border-radius:999px;background:rgba(244,238,225,0.08);color:var(--bone);}
        .drawer-close::before,.drawer-close::after{position:absolute;top:20px;left:12px;width:18px;height:2px;border-radius:999px;background:currentColor;content:"";}
        .drawer-close::before{transform:rotate(45deg);}.drawer-close::after{transform:rotate(-45deg);}
        .drawer-links{display:grid;gap:8px;margin-top:28px;}
        .drawer-links a{padding:15px 18px;border-radius:14px;background:rgba(244,238,225,0.05);border:1px solid var(--border);
            font-family:var(--f-util);font-size:17px;font-weight:600;transition:.18s;}
        .drawer-links a:hover{background:rgba(47,201,138,0.1);border-color:rgba(47,201,138,0.3);}
        .drawer-cta{position:absolute;right:24px;bottom:24px;left:24px;display:flex;justify-content:center;padding:15px 18px;border-radius:999px;
            background:linear-gradient(135deg,var(--turmeric),var(--gold-deep));color:#17201C;font-family:var(--f-util);font-weight:700;}

        @keyframes spin{to{transform:rotate(360deg);}}
        @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
        @media (max-width:820px){
            .nav-links{display:none;}
            .menu-open span:last-child{display:none;}
            .orb{width:min(280px,72vw);}
        }
        @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{transition-duration:0.01ms!important;animation-duration:0.01ms!important;}
        }
    </style>
</head>
<body>
    <div class="error-page" data-error-page>
        <div class="error-bg" aria-hidden="true">
            <div class="error-code" data-error-code>{{ status_code }}</div>
        </div>

        <nav class="error-nav" aria-label="Error page navigation">
            <a class="brand" href="/" aria-label="Kash AI home">
                <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                    <circle cx="20" cy="20" r="18" stroke="#E8B24A" stroke-width="1.5" opacity="0.5"/>
                    <path d="M6 20c4-9 8-13 14-13s10 4 14 13c-4 9-8 13-14 13S10 29 6 20Z" stroke="#2FC98A" stroke-width="1.5" fill="none"/>
                    <circle cx="20" cy="20" r="4.5" fill="#E8B24A"/>
                </svg>
                <span>Kash AI</span>
            </a>
            <div class="nav-links">
                <a href="/telemedicine/book">Consult</a>
                <a href="/order-medicines">Medicines</a>
                <a href="/diagnostics/lab-booking">Labs</a>
                <a href="/contact">Contact</a>
            </div>
            <button class="menu-open" type="button" data-menu-open aria-label="Open menu">
                <span class="menu-icon" aria-hidden="true"><span></span></span>
                <span>Menu</span>
            </button>
        </nav>

        <div class="center-media" aria-hidden="true">
            <div class="orb"></div>
        </div>

        <main class="error-content">
            <h1>{{ error_title }}</h1>
            <p>{{ error_message }}</p>
            {% if error_id %}
            <span class="error-id">Error ID: {{ error_id }}</span>
            {% endif %}
            <a class="home-link" href="/">
                <span class="arrow-left" aria-hidden="true"></span>
                Back to Home
            </a>
        </main>

        <div class="drawer" data-drawer>
            <div class="drawer-backdrop" data-menu-close></div>
            <aside class="drawer-panel" aria-label="Menu">
                <div class="drawer-head">
                    <a class="menu-brand" href="/">
                        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                            <circle cx="20" cy="20" r="18" stroke="#E8B24A" stroke-width="1.5" opacity="0.5"/>
                            <path d="M6 20c4-9 8-13 14-13s10 4 14 13c-4 9-8 13-14 13S10 29 6 20Z" stroke="#2FC98A" stroke-width="1.5" fill="none"/>
                            <circle cx="20" cy="20" r="4.5" fill="#E8B24A"/>
                        </svg>
                        <span>Kash AI</span>
                    </a>
                    <button class="icon-button drawer-close" type="button" data-menu-close aria-label="Close menu"></button>
                </div>
                <div class="drawer-links">
                    <a href="/">Home</a>
                    <a href="/telemedicine/book">Consult</a>
                    <a href="/order-medicines">Medicines</a>
                    <a href="/diagnostics/lab-booking">Labs</a>
                    <a href="/contact">Contact</a>
                </div>
                <a class="drawer-cta" href="/">Back to Home</a>
            </aside>
        </div>
    </div>

    <script>
        (function () {
            const page = document.querySelector("[data-error-page]");
            const code = document.querySelector("[data-error-code]");
            const drawer = document.querySelector("[data-drawer]");
            const openButton = document.querySelector("[data-menu-open]");
            const closeButtons = document.querySelectorAll("[data-menu-close]");

            function updateScale() {
                if (!page || !code) return;
                const height = code.getBoundingClientRect().height || 1;
                const scale = Math.max(0.8, Math.min(1.5, (window.innerHeight / height) * 0.9));
                page.style.setProperty("--code-scale", String(scale * 1.15));
            }

            function setMenu(open) {
                if (!drawer) return;
                drawer.classList.toggle("is-open", open);
                document.body.style.overflow = open ? "hidden" : "";
                openButton && openButton.setAttribute("aria-expanded", String(open));
            }

            updateScale();
            window.addEventListener("resize", updateScale);
            openButton && openButton.addEventListener("click", () => setMenu(true));
            closeButtons.forEach((button) => button.addEventListener("click", () => setMenu(false)));
            window.addEventListener("keydown", (event) => { if (event.key === "Escape") setMenu(false); });
        })();
    </script>
</body>
</html>
